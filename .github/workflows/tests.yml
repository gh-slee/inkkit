name: Tests and publication checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: macos-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.12']
    env:
      XTEINK_TESTING: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Audit public worktree, index and complete reachable history
        run: |
          python scripts/check_publication.py --worktree
          python scripts/check_publication.py --staged
          python scripts/check_publication.py --all-history
      - name: Synthetic unit tests (no real disk mutations)
        run: python -m unittest discover -s tests -v -b
      - name: Compile and CLI smoke checks
        run: |
          python -m compileall -q xteink_sd_migrate.py disk_safety.py scripts tests
          python xteink_sd_migrate.py --version
          python xteink_sd_migrate.py --help
